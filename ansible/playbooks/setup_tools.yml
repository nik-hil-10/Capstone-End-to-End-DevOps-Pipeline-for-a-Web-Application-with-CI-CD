---
- name: Setup DevOps Automation Tools (Docker, AWS CLI, kubectl, Helm, Terraform)
  hosts: all
  become: yes

  tasks:
    - name: Update apt repository cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - unzip
          - software-properties-common
          - git
          - jq
          - openjdk-17-jre-headless
        state: present

    # =========================================================================
    # 1. Jenkins LTS Installation
    # =========================================================================
    - name: Add Jenkins official apt key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Add Jenkins official APT repository
      apt_repository:
        repo: "deb https://pkg.jenkins.io/debian-stable binary/"
        state: present
        update_cache: yes

    - name: Install Jenkins LTS
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Ensure Jenkins service is started and enabled
      service:
        name: jenkins
        state: started
        enabled: yes

    # =========================================================================
    # 2. Docker Installation
    # =========================================================================
    - name: Add Docker official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker APT repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker CE and CLI
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is enabled and running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add current and jenkins users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - ubuntu
        - jenkins
      ignore_errors: yes

    # =========================================================================
    # 2. AWS CLI v2 Installation
    # =========================================================================
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_cli_check
      ignore_errors: yes
      changed_when: false

    - name: Download and install AWS CLI v2
      when: aws_cli_check.rc != 0
      block:
        - name: Download AWS CLI v2 zip
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            dest: "/tmp/awscliv2.zip"
            mode: '0644'

        - name: Unarchive AWS CLI v2
          unarchive:
            src: "/tmp/awscliv2.zip"
            dest: "/tmp"
            remote_src: yes

        - name: Run AWS CLI installer
          command: /tmp/aws/install --update

    # =========================================================================
    # 3. Kubectl Installation
    # =========================================================================
    - name: Download latest stable kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
        dest: "/usr/local/bin/kubectl"
        mode: '0755'

    # =========================================================================
    # 4. Helm 3 Installation
    # =========================================================================
    - name: Download and install Helm
      shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # =========================================================================
    # 5. Terraform Installation
    # =========================================================================
    - name: Add HashiCorp GPG key
      apt_key:
        url: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: Add HashiCorp repository
      apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
        state: present

    - name: Install Terraform
      apt:
        name: terraform
        state: present
        update_cache: yes

    # =========================================================================
    # 6. Verification
    # =========================================================================
    - name: Verify installed tool versions
      shell: |
        echo "=== Tool Versions ==="
        docker --version
        aws --version
        kubectl version --client --output=yaml | grep gitVersion
        helm version --short
        terraform version | head -n 1
      register: tool_versions
      changed_when: false

    - name: Display verification output
      debug:
        var: tool_versions.stdout_lines
